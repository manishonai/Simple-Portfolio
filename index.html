<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050506" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7" />
    <script>
      // Runs before first paint so a saved or system theme never flashes the other one.
      try {
        var theme = localStorage.getItem('theme');
      } catch (e) {}
      if (theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark');
      }
    </script>
    <meta name="description" content="Manish R - Applied AI Engineer building production LLM systems: multi-agent orchestration, RAG, evaluation, and deployment." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Manish R - Applied AI Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
